name: ${COMPOSE_PROJECT_NAME}

services:
  oracle-wallet:
    image: ${ORACLE_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-oracle-wallet
    ports:
      - "${WALLET_ORACLE_PORT}:1521"
    environment:
      ORACLE_PASSWORD: ${WALLET_ORACLE_SYSTEM_PASSWORD}
      APP_USER: ${WALLET_ORACLE_APP_USER}
      APP_PASSWORD: ${WALLET_ORACLE_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    volumes:
      - oracle_wallet_data:/opt/oracle/oradata

  redis:
    image: redis:8-alpine
    container_name: payguard-redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  oracle-loan:
    image: ${ORACLE_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-oracle-loan
    ports:
      - "${LOAN_ORACLE_PORT}:1521"
    environment:
      ORACLE_PASSWORD: ${LOAN_ORACLE_SYSTEM_PASSWORD}
      APP_USER: ${LOAN_ORACLE_APP_USER}
      APP_PASSWORD: ${LOAN_ORACLE_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    volumes:
      - oracle_loan_data:/opt/oracle/oradata

  oracle-otp:
    image: ${ORACLE_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-oracle-otp
    ports:
      - "${OTP_ORACLE_PORT}:1521"
    environment:
      ORACLE_PASSWORD: ${OTP_ORACLE_SYSTEM_PASSWORD}
      APP_USER: ${OTP_ORACLE_APP_USER}
      APP_USER_PASSWORD: ${OTP_ORACLE_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    volumes:
      - oracle_otp_data:/opt/oracle/oradata

  oracle-collateral:
    image: ${ORACLE_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-oracle-collateral
    ports:
      - "${COLLATERAL_ORACLE_PORT}:1521"
    environment:
      ORACLE_PASSWORD: ${COLLATERAL_ORACLE_SYSTEM_PASSWORD}
      APP_USER: ${COLLATERAL_ORACLE_APP_USER}
      APP_PASSWORD: ${COLLATERAL_ORACLE_APP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    volumes:
      - oracle_collateral_data:/opt/oracle/oradata

  kafka:
    image: ${KAFKA_IMAGE}
    container_name: ${COMPOSE_PROJECT_NAME}-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  wallet-service:
    build:
      context: .
      dockerfile: payguard-wallet-service/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-wallet-service
    ports:
      - "${WALLET_SERVICE_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-wallet:1521/FREE
      SPRING_DATASOURCE_USERNAME: ${WALLET_ORACLE_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${WALLET_ORACLE_APP_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      oracle-wallet: { condition: service_healthy }
      kafka: { condition: service_healthy }

  loan-service:
    build:
      context: .
      dockerfile: payguard-loan-service/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-loan-service
    ports:
      - "${LOAN_SERVICE_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-loan:1521/FREE
      SPRING_DATASOURCE_USERNAME: ${LOAN_ORACLE_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${LOAN_ORACLE_APP_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      oracle-loan: { condition: service_healthy }
      kafka: { condition: service_healthy }

  collateral-service:
    build:
      context: .
      dockerfile: payguard-collateral-service/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-collateral-service
    ports:
      - "${COLLATERAL_SERVICE_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-collateral:1521/FREE
      SPRING_DATASOURCE_USERNAME: ${COLLATERAL_ORACLE_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${COLLATERAL_ORACLE_APP_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      oracle-collateral: { condition: service_healthy }
      kafka: { condition: service_healthy }

  otp-service:
    build:
      context: .
      dockerfile: payguard-otp-service/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-otp-service
    ports:
      - "${OTP_SERVICE_PORT}:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-otp:1521/FREE
      SPRING_DATASOURCE_USERNAME: ${OTP_ORACLE_APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${OTP_ORACLE_APP_PASSWORD}
      OTP_SECURITY_PEPPER: ${OTP_SECURITY_PEPPER}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      oracle-otp: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

volumes:
  oracle_wallet_data:
  oracle_loan_data:
  oracle_collateral_data:
  kafka_data:
  oracle_otp_data:
