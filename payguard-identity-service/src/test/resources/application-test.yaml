payguard:
  vault:
    enabled: false
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    default-schema: payguard
    schemas: payguard
    create-schemas: false
    clean-disabled: true
  jpa:
    open-in-view: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
