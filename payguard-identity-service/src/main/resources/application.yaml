spring:
  application:
    name: payguard-identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 300000
      keepalive-time: 30000
  jpa:
    properties:
      hibernate.default_schema: payguard
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  shutdown: graceful
  port: ${OTP_SERVICE_PORT:8084}

identity:
  delivery:
    mode: ${OTP_DELIVERY_MODE:mock}
  challenge:
    random-ttl: ${OTP_RANDOM_TTL:PT5M}
    totp-ttl: ${OTP_TOTP_TTL:PT30S}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
  rate-limit:
    max-issues: ${OTP_MAX_ISSUES:3}
    max-verifications: ${OTP_MAX_VERIFICATIONS:20}
    window: ${OTP_RATE_LIMIT_WINDOW:PT15M}
  audit:
    retention: ${OTP_AUDIT_RETENTION:P1097D}
  kafka:
    topic: ${OTP_KAFKA_TOPIC:identity.events.v1}

payguard:
  vault:
    enabled: true
    address: ${VAULT_ADDR}
    ca-file: ${VAULT_CA_FILE}
    token-file: ${VAULT_TOKEN_FILE}
    secret-prefix: ${PAYGUARD_ENVIRONMENT:local}/identity

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,vault,otpKeys
  endpoints:
    web:
      exposure:
        include: health,info

spring.lifecycle.timeout-per-shutdown-phase: 20s
