syntax = "proto3";

package payguard.loan.v1;

import "payguard/common/v1/common.proto";

option java_multiple_files = true;
option java_package = "dev.amg.payguard.proto.loan.v1";
option java_outer_classname = "LoanProto";

service LoanService {
  rpc GetLoan(GetLoanRequest) returns (LoanResponse);
  rpc ApproveLoan(LoanCommandRequest) returns (LoanResponse);
  rpc CreateRepayment(RepaymentRequest) returns (RepaymentResponse);
  rpc OriginateLoan(OriginateLoanRequest) returns (LoanResponse);
  rpc GetSchedule(GetLoanRequest) returns (ScheduleResponse);
  rpc DisputeLoan(LoanCommandRequest) returns (LoanResponse);
}

message GetLoanRequest {
  payguard.common.v1.RequestContext context = 1;
  string loan_id = 2;
}

message LoanCommandRequest {
  payguard.common.v1.RequestContext context = 1;
  string loan_id = 2;
}

message RepaymentRequest {
  payguard.common.v1.RequestContext context = 1;
  string loan_id = 2;
  payguard.common.v1.Money amount = 3;
}

message LoanResponse {
  string loan_id = 1;
  string organization_id = 2;
  string borrower_id = 3;
  string status = 4;
  payguard.common.v1.Money outstanding_principal = 5;
}

message RepaymentResponse {
  string repayment_id = 1;
  string loan_id = 2;
  string status = 3;
  payguard.common.v1.Money applied_amount = 4;
}

message OriginateLoanRequest {
  payguard.common.v1.RequestContext context = 1;
  string borrower_id = 2;
  string collateral_id = 3;
  payguard.common.v1.Money principal = 4;
  string annual_rate = 5;
  int32 term_months = 6;
}

message ScheduleResponse { repeated Installment installments = 1; }
message Installment {
  string installment_id = 1;
  int32 number = 2;
  string due_date = 3;
  payguard.common.v1.Money principal = 4;
  payguard.common.v1.Money interest = 5;
  payguard.common.v1.Money paid = 6;
}
