spring:
  application:
    name: payguard-loan-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 300000
      keepalive-time: 30000
  jpa:
    properties:
      hibernate.default_schema: payguard
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false

payguard:
  vault:
    enabled: true
    address: ${VAULT_ADDR}
    ca-file: ${VAULT_CA_FILE}
    token-file: ${VAULT_TOKEN_FILE}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,vault
  endpoints:
    web:
      exposure:
        include: health,info

server:
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s
