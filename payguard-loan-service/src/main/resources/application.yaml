spring:
  application:
    name: payguard-loan-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate.default_schema: payguard
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
    locations: classpath:db/migration/postgresql
    clean-disabled: true
    url: ${SPRING_DATASOURCE_URL}
    user: ${PAYGUARD_MIGRATION_USERNAME}
    password: ${PAYGUARD_MIGRATION_PASSWORD}
    default-schema: payguard
    schemas: payguard
    create-schemas: false

payguard:
  vault:
    enabled: true
    address: ${VAULT_ADDR}
    ca-file: ${VAULT_CA_FILE}
    role-id-file: ${VAULT_ROLE_ID_FILE}
    secret-id-file: ${VAULT_SECRET_ID_FILE}
    database-role: ${PAYGUARD_ENVIRONMENT:local}-loan-runtime

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,vault
  endpoints:
    web:
      exposure:
        include: health,info
