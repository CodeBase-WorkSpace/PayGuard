name: Quality Assurance

# This makes the workflow reusable by other workflows
on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-analysis-and-tests:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Verify pre-push hook
        run: python3 -m unittest discover -s git-hook -p 'test_*.py' -v

      - name: Run formatting, static analysis, and tests
        run: bash ./gradlew --no-daemon --build-cache check
