name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Detect local act runtime
        id: runtime
        shell: bash
        run: |
          if [ "${ACT:-}" = "true" ]; then
            echo "under_act=true" >> "$GITHUB_OUTPUT"
          else
            echo "under_act=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: ${{ steps.runtime.outputs.under_act != 'true' }}
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: autobuild

      - name: Autobuild
        if: ${{ steps.runtime.outputs.under_act != 'true' }}
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        if: ${{ steps.runtime.outputs.under_act != 'true' }}
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

      - name: Validate CodeQL workflow under act
        if: ${{ steps.runtime.outputs.under_act == 'true' }}
        run: |
          test -f .github/workflows/codeql.yml
          test -f pom.xml
          echo "CodeQL analysis runs on GitHub; act validated the workflow contract locally."
