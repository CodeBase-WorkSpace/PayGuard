spring:
  datasource:
    # Replaced by CollateralServiceApplicationTests.oracleProperties at runtime.
    url: ${TEST_ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${TEST_ORACLE_USERNAME:PAYGUARD_TEST}
    password: ${TEST_ORACLE_PASSWORD:payguard_test}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    # Schema migrations are exercised independently; context tests only need
    # the Oracle-backed JPA infrastructure to start.
    enabled: false
