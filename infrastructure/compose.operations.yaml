  operations:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    profiles:
    - operations
    build:
      context: ./infrastructure/operations
    user: ${PAYGUARD_LOCAL_UID:-1000}:${PAYGUARD_LOCAL_GID:-1000}
    group_add:
    - ${PAYGUARD_DOCKER_GID:-0}
    working_dir: ${PAYGUARD_REPO_ROOT:-/workspace/payguard}
    entrypoint:
    - ansible-playbook
    - -i
    - localhost,
    - -c
    - local
    environment:
      PAYGUARD_REPO_ROOT: ${PAYGUARD_REPO_ROOT:-/workspace/payguard}
      PAYGUARD_RUNTIME_ROOT: ${PAYGUARD_RUNTIME_ROOT:-/dev/shm/payguard}
      PAYGUARD_LOCAL_UID: ${PAYGUARD_LOCAL_UID:-1000}
      PAYGUARD_LOCAL_GID: ${PAYGUARD_LOCAL_GID:-1000}
      PAYGUARD_DOCKER_GID: ${PAYGUARD_DOCKER_GID:-0}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-payguard}
      ANSIBLE_CONFIG: ${PAYGUARD_REPO_ROOT:-/workspace/payguard}/infrastructure/operations/ansible.cfg
      ANSIBLE_LOCAL_TEMP: /tmp/ansible
      ANSIBLE_REMOTE_TEMP: /tmp/ansible
      ANSIBLE_HOME: /tmp/ansible-home
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: .
      target: ${PAYGUARD_REPO_ROOT:-/workspace/payguard}
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${PAYGUARD_RUNTIME_ROOT:-/dev/shm/payguard}
      target: ${PAYGUARD_RUNTIME_ROOT:-/dev/shm/payguard}
      read_only: false
      bind:
        create_host_path: false
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,uid=${PAYGUARD_LOCAL_UID:-1000},gid=${PAYGUARD_LOCAL_GID:-1000},mode=0700
    networks:
    - database
    - operations
