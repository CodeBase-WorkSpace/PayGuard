services:
  agent-identity:
    read_only: true
    cap_drop: &id001
    - ALL
    security_opt: &id002
    - no-new-privileges:true
    profiles:
    - migration
    image: hashicorp/vault:2.1.2@sha256:c2f666266f383d2cf424d86b8bb8ce7d065562173ffec2b476d762943608bb55
    user: ${PAYGUARD_LOCAL_UID:-1000}:${PAYGUARD_LOCAL_GID:-1000}
    entrypoint:
    - vault
    - agent
    - -config=/etc/vault/agent.hcl
    - -log-level=error
    restart: 'no'
    logging: &id003
      driver: none
    networks: &id004
    - operations
    volumes:
    - type: bind
      source: ./infrastructure/vault/agent/identity.hcl
      target: /etc/vault/agent.hcl
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./.local/payguard/ca.crt
      target: /etc/vault/ca.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./.local/payguard/operator/identity
      target: /run/agent-auth
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PAYGUARD_ATTEMPT_ROOT:-/run/payguard-unset}/identity/private
      target: /run/agent-private
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${PAYGUARD_ATTEMPT_ROOT:-/run/payguard-unset}/identity/handoff
      target: /run/agent-handoff
      read_only: false
      bind:
        create_host_path: false
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,uid=${PAYGUARD_LOCAL_UID:-1000},gid=${PAYGUARD_LOCAL_GID:-1000},mode=0700
  migrate-identity:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    profiles:
    - migration
    image: flyway/flyway:13.7.0-alpine@sha256:4b95b4ba46a948262ee3420a112d233992cdbd3f73bab37335d8f3cd9e5e369d
    user: ${PAYGUARD_LOCAL_UID:-1000}:${PAYGUARD_LOCAL_GID:-1000}
    restart: 'no'
    logging:
      driver: none
    command:
    - -configFiles=/flyway/conf/flyway.toml,/run/agent-handoff/credential.toml
    - migrate
    depends_on:
      agent-identity:
        condition: service_completed_successfully
      postgres-identity:
        condition: service_healthy
    volumes:
    - type: bind
      source: ./infrastructure/flyway/flyway.toml
      target: /flyway/conf/flyway.toml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./payguard-identity-service/src/main/resources/db/migration/postgresql
      target: /flyway/sql
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./infrastructure/flyway/callbacks/identity
      target: /flyway/callbacks
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PAYGUARD_ATTEMPT_ROOT:-/run/payguard-unset}/identity/handoff
      target: /run/agent-handoff
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./.local/payguard/ca.crt
      target: /run/agent-ca/ca.crt
      read_only: true
      bind:
        create_host_path: false
    networks:
    - database
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,uid=${PAYGUARD_LOCAL_UID:-1000},gid=${PAYGUARD_LOCAL_GID:-1000},mode=0700
