[flyway]
locations = ["filesystem:/flyway/sql", "filesystem:/flyway/callbacks"]
defaultSchema = "payguard"
createSchemas = false
cleanDisabled = true
baselineOnMigrate = false
outOfOrder = false
validateOnMigrate = true
validateMigrationNaming = true
lockRetryCount = 10
executeInTransaction = true
# The Agent credential selects the stable owner at JDBC connection startup.

[environments.default]
schemas = ["payguard"]
connectRetries = 3
