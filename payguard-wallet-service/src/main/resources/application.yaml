spring:
  application:
    name: wallet-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
  jooq:
    sql-dialect: POSTGRES

payguard:
  vault:
    enabled: true
    address: ${VAULT_ADDR}
    ca-file: ${VAULT_CA_FILE}
    role-id-file: ${VAULT_ROLE_ID_FILE}
    secret-id-file: ${VAULT_SECRET_ID_FILE}
    database-role: ${PAYGUARD_ENVIRONMENT:local}-wallet-runtime

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,vault
  endpoints:
    web:
      exposure:
        include: health,info
